# CyberDeck CI — the four gates (lint / typecheck / test / build) for engine + client.
# Runs on every push and PR; configure these jobs as required status checks on the
# default branch so a red gate blocks merge (see ci/README.md, PROJ-102).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Lint + race-tested build of the Go engine on Linux (gcc present → -race works).
  engine:
    name: engine (lint + test -race, linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run
      - name: go test -race
        run: go test -race ./...
      - name: go build
        run: go build ./...

  # Cross-OS compile + test of the engine (no -race, to avoid per-runner C toolchain
  # variance) so the engine is proven green on all three desktop OSes.
  engine-cross:
    name: engine (build + test)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - run: go build ./...
      - run: go test ./...

  # Flutter client: analyze + test + a toolchain-free build (asset bundle). Per-OS
  # desktop/mobile installers are built by the EPIC-1 matrix tickets (PROJ-190/191/192).
  client:
    name: client (analyze + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      - name: dart analyze
        run: dart analyze
      - name: flutter test
        run: flutter test
      - name: flutter build (bundle)
        run: flutter build bundle
