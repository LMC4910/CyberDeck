# CyberDeck monorepo task runner (https://taskfile.dev).
# Cross-platform replacement for make on Windows. Targets fan out to the Go
# engine and the Flutter client. Client targets no-op gracefully until the
# Flutter client/ scaffold exists (PROJ-101 client half).
version: "3"

tasks:
  default:
    desc: "Show available targets"
    silent: true
    cmds:
      - 'echo "CyberDeck — task lint | task test | task build (run \"task --list-all\" for all)"'

  lint:
    desc: "Lint engine (go vet + golangci-lint) and client (dart analyze)"
    cmds:
      - task: lint:engine
      - task: lint:client

  lint:engine:
    desc: "go vet + golangci-lint on the engine module"
    dir: engine
    cmds:
      - go vet ./...
      - golangci-lint run

  lint:client:
    desc: "dart analyze on the Flutter client (skipped until client/ exists)"
    cmds:
      - cmd: |
          if [ -d client ]; then
            cd client && dart analyze
          else
            echo "client/ not present yet (Flutter scaffold pending) - skipping dart analyze"
          fi

  test:
    desc: "Test engine and client"
    cmds:
      - task: test:engine
      - task: test:client

  test:engine:
    desc: "go test on the engine module"
    dir: engine
    cmds:
      - go test ./...

  test:client:
    desc: "flutter test (skipped until client/ exists)"
    cmds:
      - cmd: |
          if [ -d client ]; then
            cd client && flutter test
          else
            echo "client/ not present yet - skipping flutter test"
          fi

  build:
    desc: "Build engine and client"
    cmds:
      - task: build:engine
      - task: build:client

  build:engine:
    desc: "go build the engine module"
    dir: engine
    cmds:
      - go build ./...

  # --- run / dev targets (the testable slice) ---

  dist:engine:
    desc: "Build the host engine + bundled plugins into run/ (engine exe + plugins/*)"
    cmds:
      - mkdir -p run/plugins/telemetry run/plugins/power
      - cd engine && go build -o ../run/cyberdeck.exe ./cmd/cyberdeck
      - cd plugins/telemetry && go build -o ../../run/plugins/telemetry/telemetry.exe .
      - cd plugins/power && go build -o ../../run/plugins/power/power.exe .

  run:engine:
    desc: "Build + run the host engine in console mode (prints a pairing QR; power dry-run)"
    deps: [dist:engine]
    dir: run
    cmds:
      - ./cyberdeck.exe --console

  run:client:
    desc: "Run the Flutter client on Windows desktop (choose Demo Mode or Connect)"
    dir: client
    cmds:
      - flutter run -d windows

  interop:
    desc: "Run the real Dart<->Go engine interop test against the built engine"
    deps: [dist:engine]
    dir: client
    env:
      CYBERDECK_ENGINE: "../run/cyberdeck.exe"
    cmds:
      - flutter test test/engine_interop_test.dart

  build:client:
    desc: "flutter build (host desktop) (skipped until client/ exists)"
    cmds:
      - cmd: |
          if [ -d client ]; then
            cd client && flutter build windows
          else
            echo "client/ not present yet - skipping flutter build"
          fi
