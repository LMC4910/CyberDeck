# CyberDeck monorepo task runner (https://taskfile.dev).
# Cross-platform replacement for make on Windows. Targets fan out to the Go
# engine and the Flutter client. Client targets no-op gracefully until the
# Flutter client/ scaffold exists (PROJ-101 client half).
version: "3"

tasks:
  default:
    desc: "Show available targets"
    silent: true
    cmds:
      - 'echo "CyberDeck — task lint | task test | task build (run \"task --list-all\" for all)"'

  lint:
    desc: "Lint engine (go vet + golangci-lint) and client (dart analyze)"
    cmds:
      - task: lint:engine
      - task: lint:client

  lint:engine:
    desc: "go vet + golangci-lint on the engine module"
    dir: engine
    cmds:
      - go vet ./...
      - golangci-lint run

  lint:client:
    desc: "dart analyze on the Flutter client (skipped until client/ exists)"
    cmds:
      - cmd: |
          if [ -d client ]; then
            cd client && dart analyze
          else
            echo "client/ not present yet (Flutter scaffold pending) - skipping dart analyze"
          fi

  test:
    desc: "Test engine and client"
    cmds:
      - task: test:engine
      - task: test:client

  test:engine:
    desc: "go test on the engine module"
    dir: engine
    cmds:
      - go test ./...

  test:client:
    desc: "flutter test (skipped until client/ exists)"
    cmds:
      - cmd: |
          if [ -d client ]; then
            cd client && flutter test
          else
            echo "client/ not present yet - skipping flutter test"
          fi

  soak:
    desc: "Perf soak: compressed run (~1 min, 8 sessions) — leak/CPU/throughput budgets (PROJ-301). Writes engine/test/soak/soak-short.json"
    dir: engine
    env:
      CYBERDECK_SOAK_REPORT: "test/soak/soak-short.json"
    cmds:
      - go test ./test/soak/ -run 'TestSoakShort|TestIdleCPUBudget' -v -timeout 5m

  soak:full:
    desc: "Perf soak: literal 8h idle run (PROJ-301). NOT for CI. Writes engine/test/soak/soak-full.json"
    dir: engine
    env:
      CYBERDECK_SOAK: "full"
      CYBERDECK_SOAK_REPORT: "test/soak/soak-full.json"
    cmds:
      - go test ./test/soak/ -run 'TestSoakFull' -v -timeout 9h

  build:
    desc: "Build engine and client"
    cmds:
      - task: build:engine
      - task: build:client

  build:engine:
    desc: "go build the engine module"
    dir: engine
    cmds:
      - go build ./...

  # --- run / dev targets (the testable slice) ---

  dist:engine:
    desc: "Build the host engine + all bundled plugins into run/ (engine exe + plugins/*)"
    cmds:
      - mkdir -p run/plugins/telemetry run/plugins/power run/plugins/volume run/plugins/launchers run/plugins/notifications run/plugins/media run/plugins/system run/plugins/smarthome
      - cd engine && go build -o ../run/cyberdeck.exe ./cmd/cyberdeck
      - cd plugins/telemetry && go build -o ../../run/plugins/telemetry/telemetry.exe .
      - cd plugins/power && go build -o ../../run/plugins/power/power.exe .
      - cd plugins/volume && go build -o ../../run/plugins/volume/volume.exe .
      - cd plugins/launchers && go build -o ../../run/plugins/launchers/launchers.exe .
      - cd plugins/notifications && go build -o ../../run/plugins/notifications/notifications.exe .
      - cd plugins/media && go build -o ../../run/plugins/media/media.exe .
      - cd plugins/system && go build -o ../../run/plugins/system/system.exe .
      - cd plugins/smarthome && go build -o ../../run/plugins/smarthome/smarthome.exe .

  # --- distribution: per-OS release bundles (engine + plugins + desktop client) ---
  # Each dist:<os> cross-compiles the Go engine + ALL five bundled plugins for that
  # target (pure-Go SQLite → CGO_ENABLED=0 cross-compiles cleanly) into dist/<os>/,
  # then builds + bundles the Flutter desktop client. The client is a NATIVE build
  # (Flutter desktop only builds on its own OS), so each dist:client:<os> runs on the
  # matching OS (locally on Windows; the macOS/Linux runners in installers.yml).
  # On a host that can't build a given client it no-ops with a clear message — but
  # the installers REQUIRE the client (a missing client fails packaging), so a real
  # release runs each dist:<os> on its own OS to get one combined installer.

  dist:windows:
    desc: "Release bundle for Windows (engine + 5 plugins + Flutter Windows client)"
    cmds:
      - task: dist:bundle
        vars: { OS: windows, GOOS: windows, GOARCH: amd64, EXT: ".exe" }
      - task: dist:client:windows

  dist:macos:
    desc: "Release bundle for macOS arm64 (engine + 5 plugins + Flutter macOS client)"
    cmds:
      - task: dist:bundle
        vars: { OS: macos, GOOS: darwin, GOARCH: arm64, EXT: "" }
      - task: dist:client:macos

  dist:linux:
    desc: "Release bundle for Linux amd64 (engine + 5 plugins + Flutter Linux client)"
    cmds:
      - task: dist:bundle
        vars: { OS: linux, GOOS: linux, GOARCH: amd64, EXT: "" }
      - task: dist:client:linux

  dist:all:
    desc: "Build the Windows, macOS and Linux release bundles"
    cmds:
      - task: dist:windows
      - task: dist:macos
      - task: dist:linux

  # dist:bundle cross-compiles the engine + every bundled plugin for OS/GOOS/GOARCH.
  # Internal helper — invoke a dist:<os> target instead. CGO is disabled so the
  # pure-Go SQLite driver cross-compiles without a C toolchain.
  dist:bundle:
    internal: true
    requires:
      vars: [OS, GOOS, GOARCH, EXT]
    env:
      CGO_ENABLED: "0"
      GOOS: "{{.GOOS}}"
      GOARCH: "{{.GOARCH}}"
    cmds:
      - mkdir -p dist/{{.OS}}/plugins/telemetry dist/{{.OS}}/plugins/power dist/{{.OS}}/plugins/volume dist/{{.OS}}/plugins/launchers dist/{{.OS}}/plugins/notifications dist/{{.OS}}/plugins/media dist/{{.OS}}/plugins/system dist/{{.OS}}/plugins/smarthome
      - cd engine && go build -o ../dist/{{.OS}}/cyberdeck{{.EXT}} ./cmd/cyberdeck
      - cd plugins/telemetry && go build -o ../../dist/{{.OS}}/plugins/telemetry/telemetry{{.EXT}} .
      - cd plugins/power && go build -o ../../dist/{{.OS}}/plugins/power/power{{.EXT}} .
      - cd plugins/volume && go build -o ../../dist/{{.OS}}/plugins/volume/volume{{.EXT}} .
      - cd plugins/launchers && go build -o ../../dist/{{.OS}}/plugins/launchers/launchers{{.EXT}} .
      - cd plugins/notifications && go build -o ../../dist/{{.OS}}/plugins/notifications/notifications{{.EXT}} .
      - cd plugins/media && go build -o ../../dist/{{.OS}}/plugins/media/media{{.EXT}} .
      - cd plugins/system && go build -o ../../dist/{{.OS}}/plugins/system/system{{.EXT}} .
      - cd plugins/smarthome && go build -o ../../dist/{{.OS}}/plugins/smarthome/smarthome{{.EXT}} .

  # dist:client:windows builds the Flutter Windows desktop client (native, on
  # Windows) and copies the runner bundle into the release dir. It no-ops gracefully
  # when the client scaffold or Flutter toolchain is absent so the engine bundle
  # still succeeds.
  dist:client:windows:
    internal: true
    cmds:
      - cmd: |
          if [ -d client/windows ]; then
            ( cd client && flutter build windows --release )
            mkdir -p dist/windows/client
            cp -r client/build/windows/x64/runner/Release/. dist/windows/client/
            echo "bundled Flutter Windows client into dist/windows/client"
          else
            echo "client/windows not present - skipping client bundle (build it natively per docs/RUNNING.md)"
          fi

  # dist:client:macos builds the Flutter macOS .app (native, on a Mac) and copies it
  # into the release dir. No-ops with a clear message off-macOS; the .pkg build
  # requires it (so a real macOS release runs this on macos-latest).
  dist:client:macos:
    internal: true
    cmds:
      - cmd: |
          if [ "$(uname -s)" = "Darwin" ] && [ -d client/macos ]; then
            ( cd client && flutter build macos --release )
            mkdir -p dist/macos/client
            cp -R client/build/macos/Build/Products/Release/*.app dist/macos/client/
            echo "bundled Flutter macOS client (.app) into dist/macos/client"
          else
            echo "not macOS (or client/macos absent) - skipping client bundle; the .pkg build requires it (run on macos-latest)"
          fi

  # dist:client:linux builds the Flutter Linux bundle (native, on Linux) and copies
  # it into the release dir. No-ops with a clear message off-Linux; the AppImage
  # build requires it (so a real Linux release runs this on ubuntu-latest).
  dist:client:linux:
    internal: true
    cmds:
      - cmd: |
          if [ "$(uname -s)" = "Linux" ] && [ -d client/linux ]; then
            ( cd client && flutter build linux --release )
            mkdir -p dist/linux/client
            cp -r client/build/linux/*/release/bundle/. dist/linux/client/
            echo "bundled Flutter Linux client into dist/linux/client"
          else
            echo "not Linux (or client/linux absent) - skipping client bundle; the AppImage build requires it (run on ubuntu-latest)"
          fi

  # --- mobile clients (remote clients — no engine; they pair with a PC engine over LAN) ---
  # The Android/iOS apps are the CyberDeck client only. There is NO engine on mobile;
  # the phone/tablet discovers and pairs with a desktop engine over the LAN. Release
  # signing is documented in docs/MOBILE_BUILD.md (Android key.properties; iOS certs).

  dist:android:
    desc: "Release Android client — APK + AAB into dist/android/ (signed if android/key.properties exists, else debug)"
    cmds:
      - cmd: |
          if [ -d client/android ]; then
            ( cd client && flutter build apk --release && flutter build appbundle --release )
            mkdir -p dist/android
            cp client/build/app/outputs/flutter-apk/app-release.apk dist/android/cyberdeck-client.apk
            cp client/build/app/outputs/bundle/release/app-release.aab dist/android/cyberdeck-client.aab
            echo "built dist/android/cyberdeck-client.{apk,aab}"
          else
            echo "client/android not present - skipping"
          fi

  dist:ios:
    desc: "Build the iOS client (macOS + Xcode only). Unsigned verification build; signed IPA via docs/MOBILE_BUILD.md"
    cmds:
      - cmd: |
          if [ "$(uname -s)" = "Darwin" ] && [ -d client/ios ]; then
            if [ -n "${IOS_EXPORT_OPTIONS:-}" ]; then
              ( cd client && flutter build ipa --release --export-options-plist="$IOS_EXPORT_OPTIONS" )
              mkdir -p dist/ios && cp client/build/ios/ipa/*.ipa dist/ios/ 2>/dev/null || true
              echo "built signed IPA into dist/ios/ (export options: $IOS_EXPORT_OPTIONS)"
            else
              ( cd client && flutter build ios --release --no-codesign )
              echo "iOS app compiled (unsigned). Set IOS_EXPORT_OPTIONS to a plist for a distributable IPA - see docs/MOBILE_BUILD.md"
            fi
          else
            echo "not macOS (or client/ios absent) - skipping; build iOS on a Mac (run on macos-latest)"
          fi

  dist:mobile:
    desc: "Build the Android + iOS clients (iOS no-ops off macOS)"
    cmds:
      - task: dist:android
      - task: dist:ios

  run:engine:
    desc: "Build + run the host engine in console mode (prints a pairing QR; power dry-run)"
    deps: [dist:engine]
    dir: run
    cmds:
      - ./cyberdeck.exe --console

  run:client:
    desc: "Run the Flutter client on Windows desktop (choose Demo Mode or Connect)"
    dir: client
    cmds:
      - flutter run -d windows

  interop:
    desc: "Run the real Dart<->Go engine interop + E2E journeys (J0/J1/J2/J6) against the built engine"
    deps: [dist:engine]
    dir: client
    env:
      CYBERDECK_ENGINE: "../run/cyberdeck.exe"
    cmds:
      - flutter test test/engine_interop_test.dart

  build:client:
    desc: "flutter build (host desktop) (skipped until client/ exists)"
    cmds:
      - cmd: |
          if [ -d client ]; then
            cd client && flutter build windows
          else
            echo "client/ not present yet - skipping flutter build"
          fi
